name: Custom Build (zzz Launcher)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:   # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest   # Actions 使用 Linux 环境执行 sed 命令

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------- 1. 修改包名 ----------
      - name: Change package name to com.zzz.launcher
        run: |
          # 替换所有 .kt .kts .xml .properties 文件中的旧包名
          find . -type f \( -name "*.kt" -o -name "*.kts" -o -name "*.xml" -o -name "*.properties" \) -exec sed -i 's/com\.movtery\.zalithlauncher/com.zzz.launcher/g' {} +
          # 重命名文件夹（注意：需要先移动原目录）
          if [ -d "ZalithLauncher/src/main/java/com/movtery/zalithlauncher" ]; then
            mkdir -p ZalithLauncher/src/main/java/com/zzz
            mv ZalithLauncher/src/main/java/com/movtery/zalithlauncher ZalithLauncher/src/main/java/com/zzz/launcher
            rmdir ZalithLauncher/src/main/java/com/movtery 2>/dev/null || true
          fi
        shell: bash

      # ---------- 2. 修改应用名称 ----------
      - name: Change app name to "zzz 启动器"
        run: |
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">zzz 启动器<\/string>/g' ZalithLauncher/src/main/res/values/strings.xml
          # 如果有中文文件夹也一并修改
          if [ -f "ZalithLauncher/src/main/res/values-zh-rCN/strings.xml" ]; then
            sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">zzz 启动器<\/string>/g' ZalithLauncher/src/main/res/values-zh-rCN/strings.xml
          fi
          if [ -f "ZalithLauncher/src/main/res/values-zh-rTW/strings.xml" ]; then
            sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">zzz 启动器<\/string>/g' ZalithLauncher/src/main/res/values-zh-rTW/strings.xml
          fi
        shell: bash

      # ---------- 3. 修改版本号 ----------
      - name: Change versionName
        run: |
          sed -i 's/versionName = ".*"/versionName = "1.0.0-zzz"/g' ZalithLauncher/build.gradle.kts
        shell: bash

      # ---------- 4. 修改主题色（科技蓝，你可以自己改） ----------
      - name: Change theme colors
        run: |
          sed -i 's/<color name="colorPrimary">.*<\/color>/<color name="colorPrimary">#1A73E8<\/color>/g' ZalithLauncher/src/main/res/values/colors.xml
          sed -i 's/<color name="colorPrimaryDark">.*<\/color>/<color name="colorPrimaryDark">#0D47A1<\/color>/g' ZalithLauncher/src/main/res/values/colors.xml
          sed -i 's/<color name="colorAccent">.*<\/color>/<color name="colorAccent">#03DAC5<\/color>/g' ZalithLauncher/src/main/res/values/colors.xml
        shell: bash

      # ---------- 5. 修改版权信息（About 页面） ----------
      - name: Change copyright text in AboutFragment
        run: |
          # 找到 AboutFragment.kt 并替换版权字符串（假设原文本包含 "©" 或 "Copyright"）
          find ZalithLauncher/src/main/java -name "AboutFragment.kt" -exec sed -i 's/©.*ZalithLauncher/© 2026 zzz | 基于 ZalithLauncher2 (GPLv3)/g' {} +
        shell: bash

      # ---------- 6. 设置 JDK（编译安卓需要） ----------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ---------- 7. 授权并编译 ----------
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --no-daemon

      # ---------- 8. 上传 APK ----------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zzz-Launcher-debug
          path: ZalithLauncher/build/outputs/apk/debug/*.apk